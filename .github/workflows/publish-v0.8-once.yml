name: Publish v0.8 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-v0-8:
    if: startsWith(github.event.head_commit.message, 'Release v0.8')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test symbol mapping and updater
        run: go test ./selftest ./updatecore
      - name: Create v0.8 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (git ls-remote --exit-code --tags origin refs/tags/v0.8) {
            Write-Error 'v0.8 tag already exists; refusing to move it.'
            exit 1
          }
          git tag v0.8 "${{ github.sha }}"
          git push origin refs/tags/v0.8
      - name: Build Windows executable with embedded icon
        shell: pwsh
        run: |
          New-Item -Type Directory dist -Force | Out-Null
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -ldflags='-H windowsgui -s -w -X main.appVersion=v0.8' -o dist/WANY-Keyboard-Switcher.exe .
      - name: Package source
        shell: pwsh
        run: |
          $paths = @('main.go','startup_windows.go','updater_windows.go','go.mod','updatecore','README.md','README.en.md','README.ja.md','release-notes','icon_app.ico','icon_app.png','icon_us.ico','icon_us.png','icon_jis.ico','icon_jis.png','rsrc_windows_amd64.syso','make_icons.py','make_windows_resource.py','selftest')
          Compress-Archive -Path $paths -DestinationPath dist/WANY-Keyboard-Switcher-source.zip -Force
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.8 *> $null) {
            Write-Error 'v0.8 release already exists; refusing to replace it.'
            exit 1
          }
          gh release create v0.8 dist/WANY-Keyboard-Switcher.exe dist/WANY-Keyboard-Switcher-source.zip --title 'WANY Keyboard Switcher v0.8' --notes-file 'release-notes/v0.8.md'
      - uses: actions/upload-artifact@v4
        with:
          name: WANY-Keyboard-Switcher-v0.8-Windows
          path: dist/*
