name: Publish keyboard switcher v0.4
on:
  push:
    branches: [main]
    paths: ['main.go']
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Release v0.4')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test keyboard mapping
        run: go test ./selftest
      - name: Build Windows 64-bit executable and package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags='-H windowsgui -s -w' -o dist/WANY-Keyboard-Switcher-v0.4.exe .
          test -s dist/WANY-Keyboard-Switcher-v0.4.exe
          zip -qr dist/WANY-Keyboard-Switcher-v0.4-source.zip main.go go.mod README.md README.en.md README.ja.md release-notes/v0.4.md selftest icon_app.ico icon_app.png icon_jis.ico icon_jis.png icon_us.ico icon_us.png rsrc_windows_amd64.syso make_icons.py make_windows_resource.py .github/workflows/release.yml
      - name: Commit built executable
        shell: bash
        run: |
          set -euo pipefail
          git add dist/WANY-Keyboard-Switcher-v0.4.exe
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Attach v0.4 Windows executable to repository'
          git push origin HEAD:main
      - name: Publish v0.4 release in three languages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4 dist/WANY-Keyboard-Switcher-v0.4.exe dist/WANY-Keyboard-Switcher-v0.4-source.zip --target "$(git rev-parse HEAD)" --title 'WANY Keyboard Switcher v0.4' --notes-file release-notes/v0.4.md
