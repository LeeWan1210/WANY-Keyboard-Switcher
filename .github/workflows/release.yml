name: Build and publish Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test symbol mapping
        run: go test ./selftest ./updatecore
      - name: Build Windows executable with embedded icon
        shell: pwsh
        run: |
          New-Item -Type Directory dist -Force | Out-Null
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -ldflags='-H windowsgui -s -w -X main.appVersion=${{ github.ref_name }}' -o dist/WANY-Keyboard-Switcher.exe .
      - name: Package source
        shell: pwsh
        run: |
          $paths = @('main.go','updater_windows.go','go.mod','updatecore','README.md','README.en.md','README.ja.md','release-notes','icon_app.ico','icon_app.png','icon_us.ico','icon_us.png','icon_jis.ico','icon_jis.png','rsrc_windows_amd64.syso','make_icons.py','make_windows_resource.py','selftest')
          Compress-Archive -Path $paths -DestinationPath dist/WANY-Keyboard-Switcher-source.zip -Force
      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/WANY-Keyboard-Switcher.exe dist/WANY-Keyboard-Switcher-source.zip --title 'WANY Keyboard Switcher ${{ github.ref_name }}' --notes-file 'release-notes/${{ github.ref_name }}.md'
      - uses: actions/upload-artifact@v4
        with:
          name: WANY-Keyboard-Switcher-Windows
          path: dist/*
