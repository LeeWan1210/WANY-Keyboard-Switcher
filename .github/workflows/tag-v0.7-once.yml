name: Create v0.7 tag once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-v0-7:
    if: github.event.head_commit.message == 'Release v0.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push v0.7 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.7 >/dev/null 2>&1; then
            echo "v0.7 already exists; refusing to move it."
            exit 0
          fi
          git tag v0.7 "$GITHUB_SHA"
          git push origin refs/tags/v0.7
