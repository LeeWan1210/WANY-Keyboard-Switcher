name: Update multilingual release description

on:
  push:
    branches: [main]
    paths:
      - 'release-notes/v0.3.md'
      - '.github/workflows/localize-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out localized release notes
        uses: actions/checkout@v4
      - name: Update existing v0.3 release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.3 --repo "${{ github.repository }}" --notes-file release-notes/v0.3.md
