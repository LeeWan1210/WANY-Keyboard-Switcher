name: Refresh v0.6 coffee button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v06-coffee-button.yml'
permissions:
  contents: write
jobs:
  refresh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish updated multilingual release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.6 --repo "${{ github.repository }}" --notes-file release-notes/v0.6.md
