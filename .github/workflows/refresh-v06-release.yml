name: Refresh v0.6 release support links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v06-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published v0.6 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.6 --repo "${{ github.repository }}" --notes-file release-notes/v0.6.md
