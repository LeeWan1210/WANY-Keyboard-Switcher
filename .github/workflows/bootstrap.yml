name: Publish WANY Keyboard Switcher v0.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'WANY-Keyboard-Switcher-v0.3-SOURCE-DOWNLOAD.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile,shutil
          archive=pathlib.Path("WANY-Keyboard-Switcher-v0.3-SOURCE-DOWNLOAD.zip")
          root=pathlib.Path(".").resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  p=pathlib.PurePosixPath(info.filename)
                  if len(p.parts)<2 or p.parts[0]!="WANY-Keyboard-Switcher-v0.3":
                      raise ValueError("Unexpected ZIP entry "+info.filename)
                  rel=pathlib.Path(*p.parts[1:])
                  target=(root/rel).resolve()
                  if not target.is_relative_to(root): raise ValueError("Unsafe path")
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src,target.open("wb") as dst:
                      shutil.copyfileobj(src,dst)
          for name in ("main.go","go.mod","icon_app.ico","icon_us.ico","icon_jis.ico","rsrc_windows_amd64.syso","selftest/mapping_test.go"):
              assert pathlib.Path(name).is_file(),name
          print("Original v0.3 source extracted")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests and build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          go test ./selftest
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags='-H windowsgui -s -w' -o dist/WANY-Keyboard-Switcher-v0.3.exe .
          test -s dist/WANY-Keyboard-Switcher-v0.3.exe
          cp WANY-Keyboard-Switcher-v0.3-SOURCE-DOWNLOAD.zip dist/WANY-Keyboard-Switcher-v0.3-source.zip
      - name: Commit readable source, icons, and EXE
        shell: bash
        run: |
          set -euo pipefail
          git add main.go go.mod README.md icon_app.ico icon_app.png icon_us.ico icon_us.png icon_jis.ico icon_jis.png rsrc_windows_amd64.syso make_icons.py make_windows_resource.py selftest/mapping.go selftest/mapping_test.go dist/WANY-Keyboard-Switcher-v0.3.exe
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add WANY Keyboard Switcher v0.3 source, icons, and Windows EXE'
          git push origin HEAD:main
      - name: Publish GitHub Release v0.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.3 dist/WANY-Keyboard-Switcher-v0.3.exe dist/WANY-Keyboard-Switcher-v0.3-source.zip --target "$(git rev-parse HEAD)" --title "WANY Keyboard Switcher v0.3" --notes "Windows 10/11 x64 US/JIS keyboard layout switcher. Keyboard EXE/tray icons and Korean/English/Japanese menus. See README for tested scenarios and limitations."
