name: Bootstrap WANY Keyboard Switcher v0.3
on:
  push:
    branches: [main]
    paths:
      - 'seed/payload.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract checked source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d seed/payload.b64 | tar -xJf -
          test -f main.go
          test -f make_icons.py
          test -f .github/workflows/release.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create illustrated icons and Windows executable resource
        run: |
          python -m pip install pillow
          python make_icons.py
          python make_windows_resource.py
      - name: Commit expanded source and icon assets
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf seed .github/workflows/bootstrap.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish WANY Keyboard Switcher v0.3 source and icons'
          git push origin HEAD:main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run mapping tests and build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          go test ./selftest
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags='-H windowsgui -s -w' -o dist/WANY-Keyboard-Switcher-v0.3.exe .
          zip -qr dist/WANY-Keyboard-Switcher-v0.3-source.zip main.go go.mod README.md selftest make_icons.py make_windows_resource.py patch_locale.py icon_app.ico icon_app.png icon_us.ico icon_us.png icon_jis.ico icon_jis.png rsrc_windows_amd64.syso .github/workflows/release.yml
      - name: Publish public GitHub Release v0.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3 dist/WANY-Keyboard-Switcher-v0.3.exe dist/WANY-Keyboard-Switcher-v0.3-source.zip --target "$(git rev-parse HEAD)" --title 'WANY Keyboard Switcher v0.3' --notes 'Windows 10/11 x64 US/JIS manual keyboard-layout selector. Native EXE with keyboard icons and Korean/English/Japanese tray menus. Windows behavior has not been independently verified on all keyboards; see README for limitations.'
